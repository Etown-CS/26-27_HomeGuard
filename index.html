<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>HomeGuard</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style/style.css">
    </head>

    <body>
        <header class="top">
            <div class="top-in">
                <div class="logo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
                    HomeGuard
                </div>
                <nav class="nav" aria-label="Main">
                    <button data-view="dashboard">Dashboard</button>
                    <button data-view="devices">Devices</button>
                    <button data-view="alerts">Alerts</button>
                </nav>
                <span id="mode" class="mode">Demo data</span>
                <div class="who"><span class="avatar" id="avatar"></span><span id="whoName"></span></div>
            </div>
        </header>

        <!-- Will update with JS file as it pulls JSON data -->
        <main id="main"></main>

        <dialog id="addDialog">
            <form method="dialog" id="addForm">
                <h2>Add a device</h2>
                <label>Device name<input name="name" required maxlength="40" placeholder="Kitchen speaker"></label>
                <label>Type
                    <select name="type"><option>Camera</option><option>Entertainment</option><option>Mobile</option><option>Computer</option><option>Smart home</option><option>Other</option></select>
                </label>
                <label>IP address<input name="ip" required pattern="^\d{1,3}(\.\d{1,3}){3}$" placeholder="192.168.1.50"></label>
                <div class="row">
                    <button type="button" class="btn" data-action="close-add">Cancel</button>
                    <button class="btn primary" value="ok">Add device</button>
                </div>
            </form>
        </dialog>

        <script src="backend/app.js"></script>

        </body>
</html>
