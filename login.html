<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | HomeGuard</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>

  <header>
    <h1>HomeGuard</h1>
    <p>Protecting your home, one sensor at a time.</p>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h2>Log in</h2>
      <p class="auth-intro">Welcome back. Log in to see what's happening on your network.</p>

      <p id="notice" class="form-notice" role="status" hidden></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="255" required>
          <p class="field-error" id="email-error" hidden></p>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
          <p class="field-error" id="password-error" hidden></p>
        </div>

        <label class="show-password">
          <input type="checkbox" id="show-password"> Show password
        </label>

        <p id="form-error" class="form-error" role="alert" hidden></p>

        <button type="submit" class="auth-button" id="submit">Log in</button>
      </form>

      <p class="auth-switch">New to HomeGuard? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script src="./backend/login.js"></script>
</body>
</html>
